name: Publish SDK

on:
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: |
          version=$(node -p "require('./packages/sdk/package.json').version")
          if [ "$GITHUB_REF_NAME" != "sdk-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - run: pnpm --filter @nogglee/feedbox typecheck
      - run: pnpm --filter @nogglee/feedbox build
      # setup-node가 만든 .npmrc가 ${NODE_AUTH_TOKEN}을 참조한다.
      # 이 값을 주지 않으면 비인증 요청이 되고, npm은 스코프 패키지에 대해
      # 권한 없음을 존재 여부가 드러나지 않도록 404로 응답한다.
      - run: npm publish
        working-directory: packages/sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
