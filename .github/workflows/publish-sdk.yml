name: Publish SDK

on:
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: |
          version=$(node -p "require('./packages/sdk/package.json').version")
          if [ "$GITHUB_REF_NAME" != "sdk-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - run: pnpm --filter @nogglee/feedbox typecheck
      - run: pnpm --filter @nogglee/feedbox build
      - run: npm publish
        working-directory: packages/sdk
